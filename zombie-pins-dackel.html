<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050805">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23050805'/%3E%3Ccircle cx='8' cy='8' r='4' fill='%239dff3a'/%3E%3C/svg%3E">
<title>WUMMI — Zombie Pinball · BANDOS7</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#000;
    display:flex;align-items:center;justify-content:center;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    touch-action:none;
  }
  canvas{
    display:block;background:#050805;touch-action:none;
    width:min(100vw, 56.25vh);
    height:min(177.7778vw, 100vh);
    box-shadow:0 0 80px rgba(90,160,40,0.12), 0 0 200px rgba(0,0,0,0.9);
  }
  noscript{color:#9dff3a;font-family:monospace;padding:20px;text-align:center;}
</style>
</head>
<body>
<canvas id="c" aria-label="WUMMI Zombie Pinball"></canvas>
<noscript>Dieses Spiel benötigt JavaScript.</noscript>
<script>
(function(){
  'use strict';
  // ============================================================
  //  WUMMI — ZOMBIE PINBALL
  //  Entwickler: BANDOS7 · Made in Deutschland
  // ============================================================

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  const W = 375, H = 667;
  const DPR = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);

  const TAU = Math.PI * 2;
  const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
  const lerp = (a,b,t)=> a+(b-a)*t;
  const rand = (a,b)=> a + Math.random()*(b-a);
  const randi = (a,b)=> Math.floor(rand(a,b+1));
  const dist = (x1,y1,x2,y2)=> Math.hypot(x2-x1,y2-y1);
  const fmt = n => Math.round(n).toLocaleString('de-DE');

  function roundRect(g,x,y,w,h,r){
    r = Math.min(r, w/2, h/2);
    g.beginPath();
    g.moveTo(x+r,y);
    g.arcTo(x+w,y,x+w,y+h,r);
    g.arcTo(x+w,y+h,x,y+h,r);
    g.arcTo(x,y+h,x,y,r);
    g.arcTo(x,y,x+w,y,r);
    g.closePath();
  }
  function cutRect(g,x,y,w,h,c){
    g.beginPath();
    g.moveTo(x+c,y);
    g.lineTo(x+w-c,y);
    g.lineTo(x+w,y+c);
    g.lineTo(x+w,y+h-c);
    g.lineTo(x+w-c,y+h);
    g.lineTo(x+c,y+h);
    g.lineTo(x,y+h-c);
    g.lineTo(x,y+c);
    g.closePath();
  }
  function makeCache(w,h,drawFn){
    const sc = 2;
    const c = document.createElement('canvas');
    c.width = Math.ceil(w*sc); c.height = Math.ceil(h*sc);
    const g = c.getContext('2d');
    g.scale(sc,sc);
    drawFn(g);
    return c;
  }
  function spaced(g,text,x,y,sp,align){
    const chars = [...text];
    let total = 0;
    for(const ch of chars) total += g.measureText(ch).width;
    total += sp * Math.max(0, chars.length-1);
    let cx = align==='center' ? x-total/2 : align==='right' ? x-total : x;
    g.textAlign = 'left';
    for(const ch of chars){
      g.fillText(ch,cx,y);
      cx += g.measureText(ch).width + sp;
    }
    return total;
  }

  // ---------- Speicher ----------
  const store = {
    get(k,d){ try{ const v = localStorage.getItem(k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
    set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
  };
  const SCORE_KEY = 'wummi.scores.v1';
  const DIFF_KEY  = 'wummi.diff.v1';
  const MUTE_KEY  = 'wummi.muted.v1';

  const DIFFS = {
    rek:     { key:'rek',     name:'REKRUT',  lives:5, ballR:10,  gravity:0.23, zSpeed:0.55, bumperCount:5, zombieCount:3, flipperPower:11,   mult:1.0, desc:'LEICHTE HORDE · GROSSE KUGEL' },
    agent:   { key:'agent',   name:'AGENT',   lives:3, ballR:8.5, gravity:0.26, zSpeed:0.80, bumperCount:7, zombieCount:4, flipperPower:12.5, mult:1.5, desc:'AUSGEWOGEN · STANDARD-PROTOKOLL' },
    veteran: { key:'veteran', name:'VETERAN', lives:2, ballR:7,   gravity:0.30, zSpeed:1.10, bumperCount:9, zombieCount:6, flipperPower:14,   mult:2.0, desc:'SCHNELLE HORDE · 2× PUNKTE' }
  };
  const G = {
    state:'menu', diff:store.get(DIFF_KEY,'agent'), t:0,
    score:0, wave:1, lives:3, best:0, rank:0,
    serving:true, charging:false, charge:0, chargeStart:0, serveAt:0,
    muted:store.get(MUTE_KEY,false),
    shake:0, slowUntil:0, combo:0, comboT:0,
    look:0, barkUntil:0, toast:'', toastUntil:0,
    banner:'', bannerSub:'', bannerUntil:0,
    respawnAt:0, glitch:0, saveUntil:0, damageFlash:0
  };
  if(!DIFFS[G.diff]) G.diff='agent';
  const cfg = ()=> DIFFS[G.diff];

  // ---------- Audio ----------
  let AC = null, master = null, ambientGain = null, NOISE = null;
  function ensureAudio(){
    if(AC){ if(AC.state==='suspended') AC.resume(); return; }
    try{
      const Ctor = window.AudioContext || window.webkitAudioContext;
      if(!Ctor) return;
      AC = new Ctor();
      master = AC.createGain();
      master.gain.value = G.muted ? 0 : 0.85;
      master.connect(AC.destination);
      startAmbient();
    }catch(e){ AC = null; }
  }
  function noiseBuf(){
    if(NOISE) return NOISE;
    const len = AC.sampleRate * 2;
    NOISE = AC.createBuffer(1, len, AC.sampleRate);
    const d = NOISE.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    return NOISE;
  }
  function burst(dur,vol,freq,type){
    if(!AC) return;
    const t = AC.currentTime;
    const src = AC.createBufferSource();
    src.buffer = noiseBuf();
    src.loop = true;
    const f = AC.createBiquadFilter();
    f.type = type || 'lowpass';
    f.frequency.value = freq || 700;
    f.Q.value = 1;
    const g = AC.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t); src.stop(t+dur);
  }
  function beep(freq,dur,type,vol,slide){
    if(!AC) return;
    const t = AC.currentTime;
    const o = AC.createOscillator();
    const g = AC.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,slide), t+dur);
    g.gain.setValueAtTime(vol||0.12,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t+dur);
  }
  function startAmbient(){
    if(!AC) return;
    const g = AC.createGain(); g.gain.value = 0.05; g.connect(master);
    const lp = AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=120;
    const o1 = AC.createOscillator(); o1.type='sine'; o1.frequency.value=47;
    const o2 = AC.createOscillator(); o2.type='sawtooth'; o2.frequency.value=54.5;
    o1.connect(lp); o2.connect(lp); lp.connect(g);
    o1.start(); o2.start();
    const lfo = AC.createOscillator(); lfo.frequency.value = 0.06;
    const lg = AC.createGain(); lg.gain.value = 0.02;
    lfo.connect(lg); lg.connect(g.gain); lfo.start();
    const src = AC.createBufferSource(); src.buffer = noiseBuf(); src.loop = true;
    const bp = AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=260; bp.Q.value=0.5;
    const wg = AC.createGain(); wg.gain.value=0.018;
    src.connect(bp); bp.connect(wg); wg.connect(master); src.start();
    ambientGain = g;
  }
  const SFX = {
    click(){ beep(420,0.06,'square',0.10,300); },
    launch(){ burst(0.28,0.20,1200,'lowpass'); beep(90,0.32,'sawtooth',0.12,320); },
    bump(){ beep(660,0.07,'square',0.10,440); burst(0.08,0.10,1600,'highpass'); },
    hit(){ burst(0.09,0.14,600,'lowpass'); beep(150,0.07,'sawtooth',0.08,90); },
    kill(){ burst(0.35,0.20,500,'lowpass'); beep(70,0.28,'sawtooth',0.13,35); },
    pickup(){ beep(620,0.09,'sine',0.13); setTimeout(()=>beep(880,0.10,'sine',0.13),80); setTimeout(()=>beep(1240,0.16,'sine',0.12),160); },
    drain(){ beep(300,0.45,'sawtooth',0.11,55); burst(0.5,0.10,300,'lowpass'); },
    wave(){ beep(440,0.16,'square',0.11); setTimeout(()=>beep(330,0.16,'square',0.11),150); setTimeout(()=>beep(550,0.32,'square',0.12),300); },
    over(){ beep(160,0.9,'sawtooth',0.14,40); setTimeout(()=>beep(90,1.4,'sine',0.12,30),200); },
    bark(){ beep(240,0.08,'square',0.14,160); setTimeout(()=>beep(190,0.12,'square',0.12,110),90); },
    flipper(){ beep(220,0.035,'square',0.05,180); }
  };
  function toggleMute(){
    G.muted = !G.muted;
    store.set(MUTE_KEY,G.muted);
    if(master) master.gain.value = G.muted ? 0 : 0.85;
  }
  // ---------- Eingabe ----------
  const pointers = new Map();
  function getPos(e){
    const r = canvas.getBoundingClientRect();
    return { x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height) };
  }
  canvas.addEventListener('pointerdown', e=>{
    if(e.pointerType==='mouse' && e.button!==0) return;
    e.preventDefault();
    ensureAudio();
    const p = getPos(e);
    pointers.set(e.pointerId, p);
    handleDown(p.x,p.y,e.pointerId);
  });
  canvas.addEventListener('pointermove', e=>{
    const p = getPos(e);
    if(pointers.has(e.pointerId)) pointers.set(e.pointerId,p);
    G.look = clamp((p.x-W/2)/120,-1,1);
  });
  function releasePointer(e){
    const p = pointers.get(e.pointerId);
    if(!p) return;
    pointers.delete(e.pointerId);
    handleUp(p.x,p.y,e.pointerId);
  }
  canvas.addEventListener('pointerup', e=>{ e.preventDefault(); releasePointer(e); });
  canvas.addEventListener('pointercancel', e=>{ releasePointer(e); });
  window.addEventListener('pointerup', e=>{ if(pointers.has(e.pointerId)) releasePointer(e); });
  canvas.addEventListener('contextmenu', e=>e.preventDefault());

  // ---------- Menü-Hintergrund (animiertes Containment-Labor) ----------
  let menuBgCache=null, playBgCache=null, titleCache=null, scanPattern=null;
  let menuDust=[];
  function initDust(){
    menuDust=[];
    for(let i=0;i<28;i++){
      menuDust.push({x:rand(0,W),y:rand(60,H-80),s:rand(0.6,2.2),v:rand(2,9),p:rand(0,TAU)});
    }
  }
  function drawDust(){
    ctx.save();
    for(const d of menuDust){
      const y = d.y - ((G.t*d.v)%620);
      const yy = y < 40 ? y+620 : y;
      const a = 0.10 + 0.10*Math.sin(G.t*2+d.p);
      ctx.fillStyle = `rgba(180,220,140,${a.toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(d.x + Math.sin(G.t*0.7+d.p)*6, yy, d.s, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  function buildMenuBg(g){
    const bg = g.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#0a120a');
    bg.addColorStop(0.45,'#0c140b');
    bg.addColorStop(1,'#040604');
    g.fillStyle = bg; g.fillRect(0,0,W,H);

    // Rückwand-Paneele
    g.strokeStyle='rgba(120,160,100,0.07)';
    g.lineWidth=1;
    for(let y=70;y<360;y+=56){
      g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke();
    }
    for(let x=0;x<W;x+=75){
      g.beginPath(); g.moveTo(x,60); g.lineTo(x,360); g.stroke();
    }
    // Nieten
    g.fillStyle='rgba(150,190,120,0.10)';
    for(let x=18;x<W;x+=75){
      for(let y=80;y<360;y+=56){
        g.beginPath(); g.arc(x,y,1.6,0,TAU); g.fill();
      }
    }

    // Deckenrohre
    g.strokeStyle='#1a2418'; g.lineWidth=9; g.lineCap='round';
    g.beginPath(); g.moveTo(-10,42); g.lineTo(W+10,42); g.stroke();
    g.strokeStyle='rgba(150,200,120,0.14)'; g.lineWidth=1.5;
    g.beginPath(); g.moveTo(-10,38); g.lineTo(W+10,38); g.stroke();
    for(let x=40;x<W;x+=90){
      g.fillStyle='#233020'; g.fillRect(x,36,10,12);
      g.fillStyle='rgba(160,210,130,0.18)'; g.fillRect(x+2,38,2,8);
    }
    // Seitenkabel
    g.strokeStyle='#162014'; g.lineWidth=6;
    g.beginPath(); g.moveTo(9,60); g.bezierCurveTo(2,180,18,300,8,420); g.stroke();
    g.beginPath(); g.moveTo(W-9,60); g.bezierCurveTo(W-2,180,W-18,300,W-8,420); g.stroke();

    // Kratzspuren
    g.save();
    g.strokeStyle='rgba(120,18,18,0.22)';g.lineWidth=2;g.lineCap='round';
    for(let i=0;i<3;i++){
      g.beginPath();
      g.moveTo(46+i*7,258);
      g.quadraticCurveTo(58+i*7,232,64+i*7,204);
      g.stroke();
    }
    for(let i=0;i<3;i++){
      g.beginPath();
      g.moveTo(W-58-i*7,262);
      g.quadraticCurveTo(W-70-i*7,236,W-76-i*7,208);
      g.stroke();
    }
    g.restore();

    // Warnschild hinten
    g.save();
    g.globalAlpha=0.10;
    g.translate(W/2,330);
    g.strokeStyle='#b8e06a'; g.lineWidth=2;
    g.beginPath(); g.arc(0,0,28,0,TAU); g.stroke();
    for(let i=0;i<3;i++){
      const a=i*TAU/3 - Math.PI/2;
      g.beginPath(); g.arc(Math.cos(a)*14,Math.sin(a)*14,9,0,TAU); g.stroke();
    }
    g.font='700 8px "Courier New",monospace'; g.textAlign='center';
    g.fillStyle='#b8e06a'; g.fillText('BIO-GEFAHR',0,48);
    g.restore();

    // Blutige Handabdrücke an der Rückwand
    g.save();
    g.globalAlpha=0.17;
    for(const hp of [[137,408,-0.35],[241,431,0.4]]){
      g.save();
      g.translate(hp[0],hp[1]);
      g.rotate(hp[2]);
      g.fillStyle='#8a1414';
      g.beginPath();g.ellipse(0,0,6,8,0,0,TAU);g.fill();
      for(let f=0;f<4;f++){
        g.beginPath();g.ellipse(-7.5+f*5,-9-((f===1||f===2)?1.5:0),2,5.5,-0.1+f*0.07,0,TAU);g.fill();
      }
      g.fillStyle='rgba(120,10,10,0.5)';
      g.fillRect(-1,7,2,14);
      g.restore();
    }
    g.restore();

    // Boden mit Perspektive
    g.save();
    const vy=470;
    const fg = g.createLinearGradient(0,vy,0,H);
    fg.addColorStop(0,'rgba(30,46,26,0)');
    fg.addColorStop(1,'rgba(26,40,22,0.55)');
    g.fillStyle=fg; g.fillRect(0,vy,W,H-vy);
    g.strokeStyle='rgba(140,190,100,0.10)'; g.lineWidth=1;
    for(let i=-7;i<=7;i++){
      g.beginPath(); g.moveTo(W/2+i*8,vy); g.lineTo(W/2+i*90,H+40); g.stroke();
    }
    for(let i=1;i<=7;i++){
      const t=i/7, y=vy+Math.pow(t,1.9)*(H-vy);
      g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke();
    }
    g.restore();

    // Vignette
    const vg = g.createRadialGradient(W/2,H/2,120,W/2,H/2,430);
    vg.addColorStop(0,'rgba(0,0,0,0)');
    vg.addColorStop(0.75,'rgba(0,0,0,0.35)');
    vg.addColorStop(1,'rgba(0,0,0,0.85)');
    g.fillStyle=vg; g.fillRect(0,0,W,H);
  }

  function drawBeacon(){
    const t=G.t;
    const bx=W-46, by=94;
    const pulse=0.5+0.5*Math.sin(t*2.1);
    const rg=ctx.createRadialGradient(bx,by,2,bx,by,80);
    rg.addColorStop(0,`rgba(255,50,40,${0.16+0.12*pulse})`);
    rg.addColorStop(1,'rgba(255,0,0,0)');
    ctx.fillStyle=rg;
    ctx.beginPath(); ctx.arc(bx,by,80,0,TAU); ctx.fill();
    ctx.fillStyle=`rgba(255,70,50,${0.55+0.4*pulse})`;
    ctx.beginPath(); ctx.arc(bx,by,3.4,0,TAU); ctx.fill();
    // rotierender Lichtkegel
    ctx.save();
    ctx.translate(bx,by);
    ctx.rotate(t*0.55);
    ctx.globalAlpha=0.045;
    ctx.fillStyle='#ff3020';
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(120,-40); ctx.lineTo(120,24); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawLampFlicker(){
    const t=G.t;
    const base=0.72 + Math.sin(t*9.1)*0.02;
    let a=base;
    if(Math.sin(t*13.7)>0.985 || Math.sin(t*3.3+1.7)>0.997) a*=0.25;
    const x=W/2, y=66;
    const lg=ctx.createRadialGradient(x,y,2,x,y,150);
    lg.addColorStop(0,`rgba(200,255,170,${0.10*a})`);
    lg.addColorStop(1,'rgba(200,255,170,0)');
    ctx.fillStyle=lg;
    ctx.beginPath(); ctx.arc(x,y,150,0,TAU); ctx.fill();
    ctx.fillStyle=`rgba(225,255,195,${0.5*a})`;
    ctx.fillRect(x-46,y-2,92,2);
  }

  function drawFog(){
    ctx.save();
    for(let i=0;i<3;i++){
      const x = (G.t*(7+i*4) + i*170) % (W+240) - 120;
      const y = 350 + i*85 + Math.sin(G.t*0.5+i)*16;
      const rg=ctx.createRadialGradient(x,y,10,x,y,120);
      rg.addColorStop(0,'rgba(120,160,100,0.055)');
      rg.addColorStop(1,'rgba(120,160,100,0)');
      ctx.fillStyle=rg;
      ctx.beginPath(); ctx.ellipse(x,y,130,54,0,0,TAU); ctx.fill();
    }
    ctx.restore();
  }

  function drawScanlines(){
    if(!scanPattern){
      const c=document.createElement('canvas'); c.width=2; c.height=3;
      const g=c.getContext('2d');
      g.fillStyle='rgba(0,0,0,0.16)'; g.fillRect(0,0,2,1);
      scanPattern=ctx.createPattern(c,'repeat');
    }
    ctx.save();
    ctx.globalAlpha=0.55;
    ctx.fillStyle=scanPattern;
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }

  function drawMenuBackground(){
    if(menuBgCache) ctx.drawImage(menuBgCache,0,0,W,H);
    else { ctx.fillStyle='#080d07'; ctx.fillRect(0,0,W,H); }

    drawBeacon();
    drawLampFlicker();
    drawFog();

    // linke & rechte Containment-Röhre
    drawTank(24,352,74,172,0);
    drawTank(277,352,74,172,1);

    // Podest
    const py=584;
    ctx.save();
    const pg=ctx.createRadialGradient(W/2,py,8,W/2,py,140);
    pg.addColorStop(0,'rgba(130,200,90,0.16)');
    pg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=pg;
    ctx.beginPath(); ctx.ellipse(W/2,py,150,34,0,0,TAU); ctx.fill();
    ctx.fillStyle='#101a0e';
    ctx.beginPath(); ctx.ellipse(W/2,py,116,23,0,0,TAU); ctx.fill();
    ctx.strokeStyle='rgba(160,220,110,0.40)'; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.ellipse(W/2,py,116,23,0,0,TAU); ctx.stroke();
    ctx.setLineDash([5,7]);
    ctx.strokeStyle='rgba(160,220,110,0.22)';
    ctx.beginPath(); ctx.ellipse(W/2,py,98,18,0,0,TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    // WUMMI
    if(G.state==='menu' || G.state==='difficulty' || G.state==='ranking'){
      drawWummi(W/2, py-46, 1.18, G.t, { look:G.look, bark: performance.now()<G.barkUntil, menu:true });
    }

    drawDust();
    drawScanlines();
  }
  // ---------- WUMMI (Dackel) ----------
  function drawWummi(cx,cy,s,t,opt){
    opt=opt||{};
    const running=!!opt.running;
    const menu=!!opt.menu;
    const bark=!!opt.bark;
    const look=clamp(opt.look||0,-1,1);
    const facing=(opt.facing||1)>=0?1:-1;
    const bob=running?Math.abs(Math.sin(t*10))*2:Math.sin(t*1.8)*0.7;
    const hop=bark?Math.abs(Math.sin(performance.now()/110))*5:0;
    const blink=menu && (Math.sin(t*1.3+2.2)>0.995);

    ctx.save();
    ctx.translate(cx,cy-bob-hop);
    // Schatten
    ctx.save();
    ctx.globalAlpha=0.35;
    ctx.fillStyle='#000';
    ctx.beginPath();ctx.ellipse(0,38*s,52*s,7*s,0,0,TAU);ctx.fill();
    ctx.restore();

    ctx.scale(facing*s,s);

    // Schwanz
    const wag=Math.sin(t*(running?13:2.3))*(running?0.55:0.4);
    ctx.strokeStyle='#5c3a1e';ctx.lineWidth=8;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(-52,-5);
    ctx.quadraticCurveTo(-74,-16-wag*8,-88,-2-wag*16);
    ctx.stroke();
    ctx.strokeStyle='#7a4f28';ctx.lineWidth=5;
    ctx.beginPath();ctx.moveTo(-52,-5);
    ctx.quadraticCurveTo(-74,-16-wag*8,-88,-2-wag*16);
    ctx.stroke();
    ctx.fillStyle='#3a2210';
    ctx.beginPath();ctx.arc(-89,-2-wag*16,3.4,0,TAU);ctx.fill();

    // Hinterbeine
    drawLeg(-42, running?Math.sin(t*10):0, '#4a2d15', -0.15);
    drawLeg(-25, running?Math.sin(t*10+Math.PI):0, '#5e3a1c', 0.1);

    // Körper
    const body=ctx.createLinearGradient(0,-18,0,20);
    body.addColorStop(0,'#b07c43');
    body.addColorStop(0.45,'#8e5d2d');
    body.addColorStop(1,'#5f3a18');
    ctx.fillStyle=body;
    roundRect(ctx,-58,-17,112,35,17);ctx.fill();
    // Bauch
    ctx.fillStyle='rgba(214,175,124,0.28)';
    roundRect(ctx,-50,3,96,13,7);ctx.fill();
    // Fellstriche
    ctx.strokeStyle='rgba(60,34,14,0.35)';ctx.lineWidth=1;
    for(let i=0;i<5;i++){
      ctx.beginPath();
      ctx.moveTo(-40+i*18,-12+((i%2)*3));
      ctx.quadraticCurveTo(-34+i*18,-6,-40+i*18,2);
      ctx.stroke();
    }

    // Vorderbeine
    drawLeg(24, running?Math.sin(t*10+Math.PI):0, '#6e451f', 0.1);
    drawLeg(41, running?Math.sin(t*10):0, '#7a4f28', -0.15);

    // Taktikweste
    const vest=ctx.createLinearGradient(0,-18,0,16);
    vest.addColorStop(0,'#2c3327');
    vest.addColorStop(0.5,'#191f16');
    vest.addColorStop(1,'#0e120c');
    ctx.fillStyle=vest;
    ctx.beginPath();
    ctx.moveTo(-46,-16);
    ctx.lineTo(32,-16);
    ctx.quadraticCurveTo(38,-9,38,2);
    ctx.quadraticCurveTo(38,12,30,14);
    ctx.lineTo(-44,15);
    ctx.quadraticCurveTo(-50,9,-50,0);
    ctx.quadraticCurveTo(-50,-9,-46,-16);
    ctx.closePath();ctx.fill();
    // Riemen
    ctx.strokeStyle='#3c4634';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(-44,-15);ctx.lineTo(-40,14);ctx.stroke();
    ctx.beginPath();ctx.moveTo(28,-15);ctx.lineTo(31,14);ctx.stroke();
    // Taschen
    ctx.fillStyle='#232b1e';
    roundRect(ctx,-32,0,17,13,3);ctx.fill();
    roundRect(ctx,2,1,15,11,3);ctx.fill();
    ctx.strokeStyle='#4a563e';ctx.lineWidth=1;
    roundRect(ctx,-32,0,17,13,3);ctx.stroke();
    roundRect(ctx,2,1,15,11,3);ctx.stroke();
    // Oranges Einsatzgerät
    const pulse=0.72+0.28*Math.sin(t*3.2);
    ctx.save();
    ctx.translate(18,-4);
    ctx.shadowColor='rgba(255,140,30,'+(0.8*pulse)+')';
    ctx.shadowBlur=10;
    ctx.fillStyle='#ff8a1e';
    ctx.beginPath();ctx.arc(0,0,5.4,0,TAU);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,230,170,'+pulse+')';
    ctx.beginPath();ctx.arc(-1.5,-1.5,2.2,0,TAU);ctx.fill();
    ctx.strokeStyle='#4a3010';ctx.lineWidth=1.4;
    ctx.beginPath();ctx.arc(0,0,6.8,0,TAU);ctx.stroke();
    ctx.restore();

    }
    // Antenne
    ctx.strokeStyle='#3a4232';ctx.lineWidth=1.6;
    ctx.beginPath();ctx.moveTo(30,-15);ctx.lineTo(36,-33);ctx.stroke();
    if(Math.sin(t*3+1)>0.4){
      ctx.fillStyle='#ff3020';
      ctx.beginPath();ctx.arc(36,-34,2,0,TAU);ctx.fill();
    }
    // Westen-Schrift
    ctx.font='700 4px "Courier New",monospace';
    ctx.fillStyle='rgba(160,220,110,0.7)';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('WUMMI',-23,6.5);

    // Halsband
    ctx.strokeStyle='#7d1414';ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(44,-2,13,-1.2,1.2);ctx.stroke();

    // Kopf
    ctx.save();
    ctx.translate(58+look*2,-14);
    ctx.rotate(-look*0.03);
    // Ohr
    const earSwing=Math.sin(t*1.4)*0.06;
    ctx.save();
    ctx.rotate(-0.25+earSwing);
    ctx.fillStyle='#5c3a1e';
    ctx.beginPath();
    ctx.moveTo(-8,-14);
    ctx.quadraticCurveTo(-18,-4,-12,14);
    ctx.quadraticCurveTo(-4,18,0,8);
    ctx.quadraticCurveTo(4,-2,-8,-14);
    ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(140,90,50,0.4)';
    ctx.beginPath();ctx.ellipse(-7,2,4,9,0.1,0,TAU);ctx.fill();
    ctx.restore();
    // Kopfkugel
    const headG=ctx.createRadialGradient(-4,-6,2,0,0,24);

    ctx.fillStyle=headG;
    ctx.beginPath();ctx.arc(0,0,19,0,TAU);ctx.fill();
    // Schnauze

    ctx.beginPath();ctx.ellipse(30,3,4,3.4,0.2,0,TAU);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.25)';
    ctx.beginPath();ctx.arc(29,2,1.1,0,TAU);ctx.fill();
    // Mund
    ctx.strokeStyle='#3a2010';ctx.lineWidth=1.5;
    if(bark){
      ctx.fillStyle='#2a0d0d';
      ctx.beginPath();ctx.ellipse(21,10,6,4.5,0.15,0,TAU);ctx.fill();
      ctx.fillStyle='#d9506a';
      ctx.beginPath();ctx.ellipse(21,12,3.4,2.6,0.1,0,TAU);ctx.fill();
    } else {
      ctx.beginPath();ctx.moveTo(16,9);ctx.quadraticCurveTo(22,12,27,8);ctx.stroke();
    }
    // Auge
    if(blink){
      ctx.strokeStyle='#1a1008';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(2,-6);ctx.lineTo(10,-6);ctx.stroke();
    } else {
      ctx.fillStyle='#fff6e6';
      ctx.beginPath();ctx.ellipse(6,-6,4.4,4.8,0,0,TAU);ctx.fill();
      ctx.fillStyle='#ff9a2e';
      ctx.beginPath();ctx.arc(6+look*1.6,-5.6,3.1,0,TAU);ctx.fill();
      ctx.fillStyle='#1a0e06';
      ctx.beginPath();ctx.arc(6+look*2.2,-5.6,1.5,0,TAU);ctx.fill();

      ctx.beginPath();ctx.arc(4.8,-7.2,1,0,TAU);ctx.fill();

    // Augenbraue
    ctx.strokeStyle='#4a2c12';ctx.lineWidth=1.6;
    ctx.beginPath();ctx.moveTo(1,-12);ctx.quadraticCurveTo(7,-14,12,-11);ctx.stroke();
    // Fellstriche Kopf
    ctx.strokeStyle='rgba(90,55,25,0.4)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(-8,-12);ctx.lineTo(-11,-4);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-12,-8);ctx.lineTo(-14,0);ctx.stroke();

    // Narbe auf der Schnauze
    ctx.strokeStyle='rgba(80,40,20,0.55)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(58,-6);ctx.lineTo(67,2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(61,-9);ctx.lineTo(64,-4);ctx.stroke();
    // Dog Tag am Halsband
    ctx.strokeStyle='rgba(190,200,180,0.65)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(47,6);ctx.lineTo(50,17);ctx.stroke();
    ctx.fillStyle='#b8c2a8';
    roundRect(ctx,45.5,16,9,11,2);ctx.fill();

    ctx.font='700 4px "Courier New",monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('W7',50,21.5);
    // grünes Rim-Light
    ctx.strokeStyle='rgba(170,255,110,0.22)';ctx.lineWidth=1.4;
    ctx.beginPath();ctx.moveTo(-46,-17);ctx.quadraticCurveTo(0,-22,38,-13);ctx.stroke();

    ctx.restore();
  }
  function drawLeg(x,swing,color,tilt){
    ctx.save();
    ctx.translate(x,11);
    ctx.rotate(swing*0.6+(tilt||0));
    ctx.fillStyle=color;
    roundRect(ctx,-4,0,8,23,4);ctx.fill();
    ctx.fillStyle='#2e1a0c';
    roundRect(ctx,-5.5,20,11,6,3);ctx.fill();
    ctx.restore();
  }

  // ---------- Zombie im Tank ----------
  function drawTankZombie(cx,cy,r,seed){
    const t=G.t;
    const variant=Math.floor(seed*5)%2;
    ctx.save();
    ctx.translate(cx,cy);
    const twitch=Math.sin(t*2.6+seed*3)>0.984?0.09*Math.sin(t*28):0;
    ctx.rotate(Math.sin(t*0.4+seed*2)*0.05+twitch);
    ctx.globalAlpha=0.97;
    // Blutwolke im Wasser
    ctx.fillStyle='rgba(120,8,16,0.11)';
    ctx.beginPath();ctx.ellipse(r*0.25,r*0.4,r*1.2,r*0.55,0.25,0,TAU);ctx.fill();
    ctx.fillStyle='rgba(120,8,16,0.07)';
    ctx.beginPath();ctx.ellipse(-r*0.5,r*1.0,r*0.5,r*0.25,-0.3,0,TAU);ctx.fill();
    // Beine (schlaff, leicht baumelnd)
    ctx.lineCap='round';
    const kick=Math.sin(t*1.5+seed*4)*2;
    ctx.strokeStyle='#1f2917';ctx.lineWidth=r*0.24;
    ctx.beginPath();ctx.moveTo(-r*0.28,r*0.68);ctx.quadraticCurveTo(-r*0.55,r*1.25,-r*0.42+kick,r*1.78);ctx.stroke();
    ctx.strokeStyle='#27331c';
    ctx.beginPath();ctx.moveTo(r*0.28,r*0.68);ctx.quadraticCurveTo(r*0.5,r*1.3,r*0.38-kick,r*1.82);ctx.stroke();
    // Stiefel
    ctx.fillStyle='#0c110a';
    ctx.beginPath();ctx.ellipse(-r*0.42+kick,r*1.84,r*0.17,r*0.1,0.25,0,TAU);ctx.fill();
    ctx.beginPath();ctx.ellipse(r*0.38-kick,r*1.88,r*0.17,r*0.1,-0.15,0,TAU);ctx.fill();
    // Torso
    const suit=ctx.createLinearGradient(0,-r*0.8,0,r*0.85);
    suit.addColorStop(0,'#4f5f35');suit.addColorStop(0.5,'#31401f');suit.addColorStop(1,'#18200f');
    ctx.fillStyle=suit;
    ctx.beginPath();
    ctx.moveTo(-r*0.5,-r*0.5);
    ctx.quadraticCurveTo(-r*0.68,r*0.05,-r*0.5,r*0.72);
    ctx.lineTo(0,r*0.84);
    ctx.lineTo(r*0.5,r*0.72);
    ctx.quadraticCurveTo(r*0.68,r*0.05,r*0.5,-r*0.5);
    ctx.quadraticCurveTo(0,-r*0.76,-r*0.5,-r*0.5);
    ctx.closePath();ctx.fill();
    // Riss
    ctx.fillStyle='rgba(80,10,14,0.9)';
    ctx.beginPath();
    ctx.moveTo(-r*0.36,-r*0.14);
    ctx.lineTo(-r*0.06,r*0.05);
    ctx.lineTo(-r*0.18,r*0.42);
    ctx.lineTo(-r*0.44,r*0.08);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(205,180,145,0.4)';ctx.lineWidth=1;
    for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(-r*0.22,r*0.04,r*(0.06+i*0.05),-1.2,0.7);ctx.stroke();}
    // Arme nach oben zum Glas
    const sway=Math.sin(t*1.2+seed*3)*0.6;
    ctx.strokeStyle='#3f4d2a';ctx.lineWidth=r*0.23;
    ctx.beginPath();ctx.moveTo(-r*0.48,-r*0.36);
    ctx.quadraticCurveTo(-r*0.95,-r*0.55,-r*1.22,-r*0.95+sway);ctx.stroke();
    ctx.strokeStyle='#4a5932';
    ctx.beginPath();ctx.moveTo(r*0.48,-r*0.36);
    ctx.quadraticCurveTo(r*0.95,-r*0.55,r*1.2,-r*0.95-sway);ctx.stroke();
    // Hände am Glas
    ctx.fillStyle='#1a2311';
    ctx.beginPath();ctx.arc(-r*1.24,-r*0.98+sway,r*0.16,0,TAU);ctx.fill();
    ctx.beginPath();ctx.arc(r*1.22,-r*0.98-sway,r*0.16,0,TAU);ctx.fill();
    // Finger
    ctx.strokeStyle='rgba(195,205,175,0.55)';ctx.lineWidth=1;
    for(let i=-1;i<=1;i++){
      ctx.beginPath();ctx.moveTo(-r*1.24+i*2.8,-r*1.08+sway);ctx.lineTo(-r*1.3+i*2.8,-r*1.24+sway);ctx.stroke();
      ctx.beginPath();ctx.moveTo(r*1.22+i*2.8,-r*1.08-sway);ctx.lineTo(r*1.28+i*2.8,-r*1.24-sway);ctx.stroke();
    }
    // Kopf / Kapuze
    const hood=ctx.createRadialGradient(-r*0.1,-r*1.0,1,0,-r*0.92,r*0.5);
    hood.addColorStop(0,'#5a6a3e');
    hood.addColorStop(1,'#2d3a1f');
    ctx.fillStyle=hood;
    ctx.beginPath();ctx.arc(0,-r*0.92,r*0.47,0,TAU);ctx.fill();
    // Gasmaske
    ctx.fillStyle='#0a1007';
    ctx.beginPath();ctx.arc(-r*0.17,-r*0.97,r*0.14,0,TAU);ctx.fill();
    ctx.beginPath();ctx.arc(r*0.17,-r*0.97,r*0.14,0,TAU);ctx.fill();
    ctx.strokeStyle='rgba(160,205,130,0.32)';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(-r*0.17,-r*0.97,r*0.14,0,TAU);ctx.stroke();
    ctx.beginPath();ctx.arc(r*0.17,-r*0.97,r*0.14,0,TAU);ctx.stroke();
    // Ein Auge glüht
    ctx.fillStyle='#d8ff9a';ctx.shadowColor='#a8ff60';ctx.shadowBlur=9;
    ctx.beginPath();ctx.arc(-r*0.17,-r*0.97,r*0.06,0,TAU);ctx.fill();
    ctx.shadowBlur=0;
    if(variant===0){
      ctx.fillStyle='rgba(216,255,160,0.55)';
      ctx.beginPath();ctx.arc(r*0.17,-r*0.97,r*0.045,0,TAU);ctx.fill();
    } else {
      ctx.strokeStyle='rgba(210,235,185,0.4)';ctx.lineWidth=0.9;
      ctx.beginPath();
      ctx.moveTo(r*0.07,-r*1.08);ctx.lineTo(r*0.17,-r*0.97);ctx.lineTo(r*0.09,-r*0.85);
      ctx.stroke();
    }
    // Filter
    ctx.fillStyle='#131a0e';
    roundRect(ctx,-r*0.12,-r*0.79,r*0.24,r*0.17,r*0.06);ctx.fill();
    // Maul / Zähne
    ctx.fillStyle='rgba(32,4,6,0.9)';
    ctx.beginPath();ctx.ellipse(0,-r*0.68,r*0.15,r*0.08,0,0,TAU);ctx.fill();
    ctx.fillStyle='rgba(215,205,175,0.8)';
    for(let i=0;i<4;i++){
      ctx.beginPath();
      ctx.moveTo(-r*0.11+i*r*0.065,-r*0.73);
      ctx.lineTo(-r*0.085+i*r*0.065,-r*0.65);
      ctx.lineTo(-r*0.06+i*r*0.065,-r*0.73);
      ctx.closePath();ctx.fill();
    }
    // Blut am Hals
    ctx.fillStyle='rgba(115,8,14,0.7)';
    ctx.fillRect(-r*0.02,-r*0.6,r*0.06,r*0.5);
    ctx.beginPath();ctx.arc(r*0.01,-r*0.1,r*0.06,0,TAU);ctx.fill();
    // grünes Gegenlicht
    ctx.strokeStyle='rgba(170,230,110,0.18)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(0,-r*0.92,r*0.5,-2.6,0.4);ctx.stroke();
    // Blutblasen
    ctx.fillStyle='rgba(180,30,30,0.35)';
    for(let i=0;i<3;i++){
      const bp=(t*0.2+i*0.33+seed)%1;
      ctx.beginPath();ctx.arc(r*0.2+Math.sin(t+i)*4,-r*0.2-bp*r*1.6,1.2+i*0.4,0,TAU);ctx.fill();
    }
    ctx.restore();
  }

  function drawTank(x,y,w,h,seed){
    const t=G.t;
    ctx.save();
    // Glow
    const gg=ctx.createRadialGradient(x+w/2,y+h/2,6,x+w/2,y+h/2,w*1.15);
    gg.addColorStop(0,'rgba(130,210,80,0.16)');
    gg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=gg;ctx.fillRect(x-18,y-18,w+36,h+36);
    // Rahmen
    ctx.fillStyle='#111a0e';
    roundRect(ctx,x-5,y-5,w+10,h+10,12);ctx.fill();
    // Glas
    const lg=ctx.createLinearGradient(x,0,x+w,0);
    lg.addColorStop(0,'#0a120a');
    lg.addColorStop(0.5,'#142110');
    lg.addColorStop(1,'#081008');
    ctx.fillStyle=lg;
    roundRect(ctx,x,y,w,h,9);ctx.fill();
    // Flüssigkeit + Inhalt
    ctx.save();
    roundRect(ctx,x,y,w,h,9);ctx.clip();
    const liq=ctx.createLinearGradient(0,y,0,y+h);
    liq.addColorStop(0,'rgba(100,180,60,0.05)');
    liq.addColorStop(0.55,'rgba(110,190,70,0.13)');
    liq.addColorStop(1,'rgba(130,220,90,0.25)');
    ctx.fillStyle=liq;
    ctx.fillRect(x,y+h*0.18,w,h*0.82);
    const bob=Math.sin(t*0.8+seed*3)*3;
    drawTankZombie(x+w/2, y+h*0.56+bob, w*0.34, seed);
    // Blasen
    for(let i=0;i<6;i++){
      const ph=(t*0.25+i*0.37+seed*0.21)%1;
      const by=y+h-ph*h;
      const bx=x+w*0.2+((i*29+seed*17)%Math.max(1,w*0.6));
      ctx.strokeStyle='rgba(190,255,150,'+(0.22*(1-ph))+')';
      ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(bx,by,1.4+ (i%3)*0.8,0,TAU);ctx.stroke();
    }
    // Blutiger Handabdruck am Glas
    ctx.save();
    ctx.globalAlpha=0.13;
    ctx.fillStyle='#7a1414';
    ctx.beginPath();ctx.ellipse(x+w*0.62,y+h*0.42,6.5,8.5,0.25,0,TAU);ctx.fill();
    for(let f=0;f<4;f++){
      ctx.beginPath();
      ctx.ellipse(x+w*0.62-8+f*5.2,y+h*0.42-9.5,2.1,5.2,-0.15+f*0.08,0,TAU);
      ctx.fill();
    }
    ctx.restore();
    // Glasreflexion
    ctx.globalAlpha=0.10;
    ctx.fillStyle='#dfffd0';
    ctx.beginPath();
    ctx.moveTo(x+8,y+12);ctx.lineTo(x+w*0.35,y+6);ctx.lineTo(x+w*0.2,y+h-8);ctx.lineTo(x+6,y+h-16);ctx.closePath();ctx.fill();
    ctx.globalAlpha=1;
    ctx.restore();
    // Rahmen vorn
    ctx.strokeStyle='#2c3a24';ctx.lineWidth=3.5;
    roundRect(ctx,x,y,w,h,9);ctx.stroke();
    ctx.strokeStyle='rgba(150,210,110,0.18)';ctx.lineWidth=1;
    roundRect(ctx,x+2.5,y+2.5,w-5,h-5,7);ctx.stroke();
    // Etikett
    ctx.fillStyle='rgba(10,16,8,0.9)';
    ctx.fillRect(x+w/2-19,y+h-22,38,12);
    ctx.strokeStyle='rgba(160,220,110,0.35)';ctx.lineWidth=1;
    ctx.strokeRect(x+w/2-19,y+h-22,38,12);
    ctx.fillStyle='#9dcf6a';
    ctx.font='700 7px "Courier New",monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(seed===0?'BIO-07':'BIO-13',x+w/2,y+h-16);
    ctx.restore();
  }

  function buildTitle(g){
    const txt='WUMMI';

  function loadScores(){
    const l=store.get(SCORE_KEY,[]);
    if(!Array.isArray(l)) return [];
    return l.filter(e=>e&&typeof e.score==='number').sort((a,b)=>b.score-a.score).slice(0,8);
  }
  function saveScore(){
    const entry={score:G.score,wave:G.wave,diff:G.diff,date:new Date().toLocaleDateString('de-DE')};
    let list=loadScores();
    list.push(entry);
    list.sort((a,b)=>b.score-a.score);
    const rank=list.findIndex(e=>e===entry)+1;
    list=list.slice(0,8);
    store.set(SCORE_KEY,list);
    G.rank=(rank<=8)?rank:0;
    G.best=list.length?list[0].score:entry.score;
  }

    setupWave();
    spawnBall();
    G.banner='WELLE 1'; G.bannerSub='EINSATZ BEGINNT'; G.bannerUntil=performance.now()+1900;
    SFX.wave();
  }

  function setupWave(){
    bumpers=[]; zombies=[]; powerups=[];
    const c=cfg();
    const layouts=[
      [[187,170],[123,246],[251,246],[107,334],[267,334],[187,300],[188,403]],
      [[187,160],[120,222],[254,222],[96,306],[278,306],[187,356],[145,404],[229,404]],
      [[95,176],[280,176],[95,292],[280,292],[187,222],[187,370],[130,332],[244,332]]
    ];
    const layout=layouts[randi(0,layouts.length-1)];
    const bc=Math.min(11,c.bumperCount+Math.floor(G.wave/2));
    for(let i=0;i<bc;i++){
      const base=layout[i%layout.length];
      const x=clamp(base[0]+rand(-13,13),52,W-52);
      const y=clamp(base[1]+rand(-13,13),130,420);
      if(Math.abs(x-W/2)<58 && y>300) continue;
      if(bumpers.every(bm=>dist(bm.x,bm.y,x,y)>46)){
        bumpers.push({x,y,r:19,flash:0,cool:0,phase:rand(0,TAU),id:i});
      }
    }
    const zc=Math.min(15,c.zombieCount+Math.floor(G.wave*1.2));
    for(let i=0;i<zc;i++) spawnZombie(c);
  }

  function spawnZombie(c){
    c=c||cfg();
    for(let tr=0;tr<40;tr++){
      const x=rand(56,W-56), y=rand(128,455);
      if(dist(x,y,W/2,H-104)<130) continue;
      if(Math.abs(x-W/2)<72 && y>310) continue;
      if(bumpers.some(b=>dist(b.x,b.y,x,y)<44)) continue;
      if(zombies.some(z=>dist(z.x,z.y,x,y)<48)) continue;
      const brute=Math.random()<0.12+G.wave*0.02;
      zombies.push({
        x,y,
        vx:rand(-1,1)*c.zSpeed*(brute?0.6:1),
        vy:rand(-1,1)*c.zSpeed*(brute?0.6:1),
        r:brute?24:17,
        hp:brute?Math.ceil(2+G.wave/2):Math.ceil(1+G.wave/4),
        phase:rand(0,TAU),
        seed:rand(0,TAU),
        cool:0,
        brute,
        mutant:Math.random()<0.18,
        hurt:0
      });
      return;
    }
  }

  function spawnBall(){
    const c=cfg();
    balls=[{
      x:W/2, y:H-104, vx:0, vy:0, r:c.ballR, baseR:c.ballR,
      serving:true, phase:rand(0,TAU), facing:1, trail:[],
      stuck:0, nudge:0, flipCool:0, bomb:false, bigUntil:0, look:0
    }];
    G.serving=true; G.charging=false; G.charge=0; G.serveAt=performance.now();
    G.respawnAt=0;
  }

  function launchBall(power){
    const b=balls.find(bb=>bb.serving);
    if(!b) return;
    const p=clamp(power==null?1:power,0.1,1);
    b.vy=-(10+7.5*p);
    b.vx=(Math.random()<0.5?-1:1)*rand(3.4,4.8);
    b.serving=false;
    G.saveUntil=performance.now()+5200;
    G.serving=false; G.charging=false; G.charge=0;
    SFX.launch();
    for(let i=0;i<14;i++){
      parts.push({x:b.x+rand(-7,7),y:b.y+8,vx:rand(-3,3),vy:rand(0,4),life:rand(280,600),max:600,size:rand(2,5),color:'rgba(200,230,190,0.5)',kind:'steam'});
    }
    if(navigator.vibrate) navigator.vibrate(20);
  }

  function capSpeed(b){
    const sp=Math.hypot(b.vx,b.vy), max=15;
    if(sp>max){ b.vx=b.vx/sp*max; b.vy=b.vy/sp*max; }
  }

  function segCircle(ax,ay,bx,by,cx,cy,r){
    const dx=bx-ax,dy=by-ay;
    const l2=dx*dx+dy*dy;
    let t=l2?((cx-ax)*dx+(cy-ay)*dy)/l2:0;
    t=clamp(t,0,1);
    const nx0=ax+dx*t, ny0=ay+dy*t;
    let nx=cx-nx0, ny=cy-ny0;
    const d=Math.hypot(nx,ny);
    if(d<r){
      if(d<0.0001){ nx=0; ny=-1; } else { nx/=d; ny/=d; }
      return {hit:true,nx,ny,pen:r-d};
    }
    return {hit:false};
  }

  function collideWalls(b){
    for(const w of WALLS){
      const c=segCircle(w[0],w[1],w[2],w[3],b.x,b.y,b.r);
      if(c.hit){
        b.x+=c.nx*(c.pen+0.5); b.y+=c.ny*(c.pen+0.5);
        const vn=b.vx*c.nx+b.vy*c.ny;
        if(vn<0){ b.vx-=1.55*vn*c.nx; b.vy-=1.55*vn*c.ny; }
        capSpeed(b);
      }
    }
  }

  function collideFlipper(b,f,now){
    const tx=f.px+Math.cos(f.angle)*f.len;
    const ty=f.py+Math.sin(f.angle)*f.len;
    const c=segCircle(f.px,f.py,tx,ty,b.x,b.y,b.r+2);
    if(!c.hit) return;
    b.x+=c.nx*(c.pen+0.5); b.y+=c.ny*(c.pen+0.5);
    const vn=b.vx*c.nx+b.vy*c.ny;
    if(vn<0){ b.vx-=1.5*vn*c.nx; b.vy-=1.5*vn*c.ny; }
    if(f.active && now>(b.flipCool||0)){
      b.vx += c.nx*3.2 + (f.px<W/2?2.2:-2.2);
      b.vy += c.ny*3.2 - 4.8;
      b.flipCool=now+120;
      SFX.hit();
      for(let i=0;i<5;i++) parts.push({x:b.x,y:b.y,vx:rand(-3,3),vy:rand(-4,2),life:260,max:260,size:rand(1,2.4),color:'rgba(180,255,120,0.8)',kind:'spark'});
    }
    capSpeed(b);
  }

  function hitBumper(b,bm,now){
    const d=dist(b.x,b.y,bm.x,bm.y)||1;
    const nx=(b.x-bm.x)/d, ny=(b.y-bm.y)/d;
    b.x=bm.x+nx*(b.r+bm.r+0.6);
    b.y=bm.y+ny*(b.r+bm.r+0.6);
    const vn=b.vx*nx+b.vy*ny;
    if(vn<0){ b.vx-=1.30*vn*nx; b.vy-=1.30*vn*ny; }
    b.vx+=nx*3.0; b.vy+=ny*3.0;
    capSpeed(b);
    if(now>bm.cool){
      bm.cool=now+150;
      bm.flash=1;
      addScore(45);
      SFX.bump();
      if(navigator.vibrate) navigator.vibrate(8);
      for(let i=0;i<9;i++) parts.push({x:bm.x+rand(-8,8),y:bm.y+rand(-8,8),vx:rand(-4,4),vy:rand(-4,4),life:rand(220,500),max:500,size:rand(1,2.8),color:i%2?'rgba(200,255,140,0.9)':'rgba(255,180,80,0.8)',kind:'spark'});
    }
  }

  function killZombie(z){
    z.dead=true;
    G.combo=Math.min(G.combo+1,10);
    G.comboT=performance.now()+2600;
    addScore(120*(1+G.combo*0.1));
    SFX.kill();
    if(navigator.vibrate) navigator.vibrate([12,30,20]);
    G.shake=Math.max(G.shake,7);
    for(let i=0;i<20;i++) parts.push({x:z.x,y:z.y,vx:rand(-5,5),vy:rand(-5,5),life:rand(350,850),max:850,size:rand(1.5,4.5),color:i%3===0?'#c8ff8a':(i%3===1?'#6fae3a':'#a3141f'),kind:'goo'});
    decals.push({x:z.x,y:z.y,r:rand(8,16),color:'rgba(70,110,30,0.22)',life:900});
    if(Math.random()<0.30) dropPowerup(z.x,z.y);
    pops.push({x:z.x,y:z.y-12,text:'+'+fmt(Math.round(120*(1+G.combo*0.1)*cfg().mult)),life:800,max:800,color:'#cfff9a'});
  }

  function hitZombie(b,z,now){
    if(z.cool>now || z.dead) return;
    z.cool=now+160;
    const d=dist(b.x,b.y,z.x,z.y)||1;
    const nx=(b.x-z.x)/d, ny=(b.y-z.y)/d;
    b.x=z.x+nx*(b.r+z.r+0.5);
    b.y=z.y+ny*(b.r+z.r+0.5);
    const vn=b.vx*nx+b.vy*ny;
    if(vn<0){ b.vx-=1.45*vn*nx; b.vy-=1.45*vn*ny; }
    b.vx+=nx*1.6; b.vy+=ny*1.6;
    capSpeed(b);
    z.hp--;
    z.hurt=1;
    addScore(22);
    SFX.hit();
    for(let i=0;i<7;i++) parts.push({x:z.x,y:z.y,vx:rand(-4,4),vy:rand(-4,4),life:rand(220,520),max:520,size:rand(1,3),color:i%2?'#9dff5a':'#a3141f',kind:'goo'});
    if(b.bomb){
      b.bomb=false;
      explode(b.x,b.y);
    } else if(z.hp<=0){
      killZombie(z);
    }
  }

  function explode(x,y){
    SFX.kill(); G.shake=Math.max(G.shake,16);
    if(navigator.vibrate) navigator.vibrate([25,40,30]);
    for(let i=0;i<34;i++) parts.push({x,y,vx:rand(-8,8),vy:rand(-8,8),life:rand(320,900),max:900,size:rand(2,5),color:i%3===0?'#ffca6a':(i%3===1?'#ff5a3a':'#9dff5a'),kind:'goo'});
    decals.push({x,y,r:26,color:'rgba(140,40,20,0.22)',life:900});
    for(const z of zombies){
      if(z.dead) continue;
      if(dist(x,y,z.x,z.y)<86){
        z.hp=0; killZombie(z);
      }
    }
    pops.push({x,y:y-20,text:'BOOM!',life:900,max:900,color:'#ffb36a'});
  }

  function dropPowerup(x,y){
    const pool=[
      {k:'M',name:'MULTIBALL',color:'#9dff3a'},
      {k:'S',name:'ZEITLUPE',color:'#4fd8ff'},
      {k:'B',name:'BOMBE',color:'#ff5a46'},
      {k:'P',name:'PANZER',color:'#ffd34a'},
      {k:'L',name:'MEDKIT',color:'#ff7bd5'}
    ];
    const t=pool[randi(0,pool.length-1)];
    powerups.push({x,y,vy:-1.4,vx:rand(-0.8,0.8),r:10,type:t.k,name:t.name,color:t.color,life:11000,phase:rand(0,TAU)});
  }

  function collectPowerup(b,pu,now){
    pu.dead=true;
    SFX.pickup();
    addScore(150);
    G.toast=pu.name; G.toastUntil=now+1600;
    pops.push({x:pu.x,y:pu.y-8,text:pu.name,life:900,max:900,color:pu.color});
    if(pu.type==='M'){
      const extra=[];
      for(let i=0;i<2;i++){
        extra.push({x:b.x+rand(-10,10),y:b.y+rand(-10,10),vx:rand(-6,6),vy:rand(-8,-4),r:b.baseR,baseR:b.baseR,serving:false,phase:rand(0,TAU),facing:1,trail:[],stuck:0,nudge:0,flipCool:0,bomb:false,bigUntil:0});
      }
      balls.push(...extra);
    } else if(pu.type==='S'){
      G.slowUntil=now+7000;
    } else if(pu.type==='B'){
      b.bomb=true;
    } else if(pu.type==='P'){
      b.bigUntil=now+7500;
    } else if(pu.type==='L'){
      G.lives++;
    }
  }

  function addScore(raw){
    G.score += Math.round(raw*cfg().mult);
    const next=G.wave*2200;
    if(G.state==='play' && G.score>=next){
      G.wave++;
      G.score+=200;
      G.banner='WELLE '+G.wave;
      G.bannerSub='GEFAHRENSTUFE ERHÖHT';
      G.bannerUntil=performance.now()+1900;
      G.shake=Math.max(G.shake,9);
      SFX.wave();
      setupWave();
    }
  }

  function drainBall(b){
    b.dead=true;
    balls=balls.filter(bb=>bb!==b);
    SFX.drain();
    G.shake=Math.max(G.shake,10);
    const now=performance.now();
    if(balls.length===0 && G.lives>0 && now<G.saveUntil){
      G.saveUntil=0;
      G.banner='BALL GERETTET';
      G.bannerSub='SICHERUNGSSYSTEM AKTIV';
      G.bannerUntil=now+1400;
      G.respawnAt=now+700;
      return;
    }
    if(balls.length===0){
      G.combo=0;
      G.lives--;
      G.damageFlash=1;
      if(G.lives<=0){
        endGame();
      } else {
        G.respawnAt=performance.now()+900;
        G.banner='LEBEN VERLOREN';
        G.bannerSub='NEUER EINSATZ';
        G.bannerUntil=performance.now()+1400;
      }
    }
  }

  function endGame(){
    if(G.state==='gameover') return;
    G.state='gameover';
    G.serving=false;
    saveScore();
    SFX.over();
    if(navigator.vibrate) navigator.vibrate([60,60,120]);
  }

  function updateGame(step){
    const now=performance.now();
    const sf=now<G.slowUntil?0.45:1;
    G.slow=sf;
    // Flipper
    for(const k of ['L','R']){
      const f=flips[k];
      f.active=f.hold||now<f.minUntil;
      f.angle=lerp(f.angle,f.active?f.up:f.rest,0.33);
    }
    // Bälle
    for(const b of balls){
      if(b.dead) continue;
      b.facing=b.vx<-0.35?-1:(b.vx>0.35?1:b.facing||1);
      b.phase+=step/1000*(b.serving?1.2:6);
      if(b.serving){
        if(G.charging){ G.charge=clamp((now-G.chargeStart)/700,0,1); }
        b.x=W/2; b.y=H-104-Math.min(G.charge,1)*4;
        b.vx=0; b.vy=0;
        // Sicherheits-Autostart: nie in der Startposition gefangen
        if(!G.charging && now-G.serveAt>7000){ launchBall(0.85); }
        if(G.charging && now-G.chargeStart>3600){ launchBall(1); }
        continue;
      }
      b.r = (b.bigUntil>now) ? b.baseR*1.6 : b.baseR;
      b.vy+=cfg().gravity*sf;
      b.vx*=0.996; b.vy*=0.996;
      b.x+=b.vx*sf; b.y+=b.vy*sf;
      capSpeed(b);
      collideWalls(b);
      // Harte obere Begrenzung (verhindert Tunneln bei hoher Geschwindigkeit)
      const topY = b.x<70
        ? lerp(92,58,clamp((b.x-16)/54,0,1))
        : (b.x>305 ? lerp(58,92,clamp((b.x-305)/54,0,1)) : 58);
      if(b.y < topY+b.r){
        b.y = topY+b.r;
        if(b.vy<0) b.vy=-b.vy*0.6;
      }
      collideFlipper(b,flips.L,now);
      collideFlipper(b,flips.R,now);
      for(const bm of bumpers){
        if(dist(b.x,b.y,bm.x,bm.y)<b.r+bm.r) hitBumper(b,bm,now);
      }
      for(const k of KICKERS){
        const dd=dist(b.x,b.y,k.x,k.y);
        if(dd<b.r+k.r){
          const nx=(b.x-k.x)/(dd||1), ny=(b.y-k.y)/(dd||1);
          b.x=k.x+nx*(b.r+k.r+0.6);
          b.y=k.y+ny*(b.r+k.r+0.6);
          b.vx=nx*4.6+k.side*2.0;
          b.vy=-8.2+Math.min(0,ny*2.2);
          capSpeed(b);
          if(now>k.cool){
            k.cool=now+130;
            k.flash=1;
            G.shake=Math.max(G.shake,5);
            addScore(35);
            SFX.bump();
            if(navigator.vibrate) navigator.vibrate(9);
            for(let i=0;i<9;i++) parts.push({x:k.x+rand(-8,8),y:k.y+rand(-6,8),vx:rand(-4,4),vy:rand(-6,1),life:rand(240,520),max:520,size:rand(1,2.6),color:i%2?'#d8ff9a':'#ff8a3a',kind:'spark'});
          }
        }
      }
      for(const z of zombies){
        if(!z.dead && dist(b.x,b.y,z.x,z.y)<b.r+z.r) hitZombie(b,z,now);
      }
      for(const pu of powerups){
        if(!pu.dead && dist(b.x,b.y,pu.x,pu.y)<b.r+pu.r+3) collectPowerup(b,pu,now);
      }
      // Anti-Feststeck-System
      const sp=Math.hypot(b.vx,b.vy);
      if(sf>=1 && sp<0.55){
        b.stuck+=step;
        if(b.stuck>1000){
          b.stuck=0;
          b.nudge=(b.nudge||0)+1;
          if(b.nudge>3){
            b.x=W/2; b.y=H*0.46; b.vx=rand(-3,3); b.vy=-6; b.nudge=0;
            pops.push({x:b.x,y:b.y-18,text:'NEUSTART',life:700,max:700,color:'#9dff3a'});
          } else {
            b.vx=rand(-5,5); b.vy=-rand(5,8);
          }
          for(let i=0;i<8;i++) parts.push({x:b.x,y:b.y,vx:rand(-4,4),vy:rand(-4,1),life:300,max:300,size:rand(1,2.5),color:'#cfff9a',kind:'spark'});
        }
      } else {
        b.stuck=0;
        if(sp>1.5) b.nudge=0;
      }
      // Trail
      b.trail.push({x:b.x,y:b.y});
      if(b.trail.length>8) b.trail.shift();
      // Rand-Sicherung
      if(b.y<H-70){
        if(b.x<20+b.r) b.x=20+b.r;
        if(b.x>W-20-b.r) b.x=W-20-b.r;
      }
      // Drain
      if(b.y>H+30){ drainBall(b); }
    }
    // Kugel-Kollision
    for(let i=0;i<balls.length;i++){
      for(let j=i+1;j<balls.length;j++){
        const a=balls[i],c=balls[j];
        if(a.dead||c.dead) continue;
        const d=dist(a.x,a.y,c.x,c.y);
        if(d<a.r+c.r && d>0.001){
          const nx=(a.x-c.x)/d,ny=(a.y-c.y)/d,pen=(a.r+c.r-d)/2;
          a.x+=nx*pen; a.y+=ny*pen; c.x-=nx*pen; c.y-=ny*pen;
          const vn=(a.vx-c.vx)*nx+(a.vy-c.vy)*ny;
          if(vn<0){ a.vx-=vn*nx; a.vy-=vn*ny; c.vx+=vn*nx; c.vy+=vn*ny; }
        }
      }
    }
    // Zombies
    for(const z of zombies){
      if(z.dead) continue;
      z.phase+=step/1000*2;
      z.x+=z.vx*sf; z.y+=z.vy*sf;
      if(z.x<50||z.x>W-50) z.vx*=-1;
      if(z.y<122||z.y>468) z.vy*=-1;
      z.hurt=Math.max(0,z.hurt-step/220);
      if(Math.random()<0.004){ z.vx=rand(-1,1)*cfg().zSpeed*(z.brute?0.6:1); z.vy=rand(-1,1)*cfg().zSpeed*(z.brute?0.6:1); }
    }
    // Powerups
    for(const pu of powerups){
      if(pu.dead) continue;
      pu.phase+=step/1000*2;
      pu.vy+=0.035*sf;
      pu.x+=pu.vx*sf; pu.y+=pu.vy*sf;
      pu.life-=step;
      if(pu.y>H-120 || pu.life<=0) pu.dead=true;
    }
    powerups=powerups.filter(p=>!p.dead);
    zombies=zombies.filter(z=>!z.dead);
    bumpers=bumpers.filter(()=>true);
    // Partikel
    for(const p of parts){
      p.x+=p.vx*sf; p.y+=p.vy*sf;
      p.vy+= (p.kind==='goo'?0.10:0.03)*sf;
      p.vx*=0.985; p.vy*=0.985;
      p.life-=step;
    }
    parts=parts.filter(p=>p.life>0);
    if(parts.length>320) parts=parts.slice(parts.length-320);
    for(const p of pops){ p.y-=0.5*sf; p.life-=step; }
    pops=pops.filter(p=>p.life>0);
    for(const d of decals){ d.life-=step; }
    decals=decals.filter(d=>d.life>0);
    // Bumper- und Kicker-Blitz
    for(const bm of bumpers){ bm.flash=Math.max(0,bm.flash-0.055); }
    for(const k of KICKERS){ k.flash=Math.max(0,k.flash-step/220); }
    // Timer
    if(G.comboT>0 && now>G.comboT){ G.combo=0; G.comboT=0; }
    if(G.shake>0) G.shake=Math.max(0,G.shake-step*0.02);
    if(G.damageFlash>0) G.damageFlash=Math.max(0,G.damageFlash-step/450);
    if(G.toastUntil<now) G.toast='';
    if(G.bannerUntil<now) G.banner='';
    // Respawn
    if(G.respawnAt && now>=G.respawnAt){ spawnBall(); }
  }
  // ---------- Spielfeld-Rendering ----------
  function buildPlayBg(g){
    const bg=g.createLinearGradient(0,50,0,H);
    bg.addColorStop(0,'#0a1109');
    bg.addColorStop(0.45,'#0c150b');
    bg.addColorStop(1,'#040703');
    g.fillStyle=bg;g.fillRect(0,0,W,H);

    // dezentes Raster
    g.strokeStyle='rgba(140,190,100,0.035)';g.lineWidth=1;
    for(let x=22;x<W-10;x+=28){
      g.beginPath();g.moveTo(x,56);g.lineTo(x,H-40);g.stroke();
    }
    for(let y=60;y<H-20;y+=28){
      g.beginPath();g.moveTo(16,y);g.lineTo(W-16,y);g.stroke();
    }
    // Seitliche Gefahrenstreifen
    for(const side of [0,1]){
      const x=side?W-16:0;
      g.save();
      g.beginPath();g.rect(x,58,16,540);g.clip();
      for(let i=-20;i<600;i+=16){

  function drawBumper(bm){
    const t=G.t;
    const pulse=0.5+0.5*Math.sin(t*2.2+bm.phase);
    ctx.save();
    ctx.translate(bm.x,bm.y);
    const gl=ctx.createRadialGradient(0,0,4,0,0,bm.r*2.4);
    gl.addColorStop(0,`rgba(120,220,70,${0.10+0.10*pulse+bm.flash*0.25})`);
    gl.addColorStop(1,'rgba(120,220,70,0)');
    ctx.fillStyle=gl;
    ctx.beginPath();ctx.arc(0,0,bm.r*2.4,0,TAU);ctx.fill();
    // Basis
    const base=ctx.createRadialGradient(-5,-6,2,0,0,bm.r);
    base.addColorStop(0,'#33402a');
    base.addColorStop(0.7,'#1a2214');
    base.addColorStop(1,'#0b1008');
    ctx.fillStyle=base;
    ctx.beginPath();ctx.arc(0,0,bm.r,0,TAU);ctx.fill();
    // Gefahrenring
    ctx.save();
    ctx.rotate(t*0.35+bm.phase);
    for(let i=0;i<8;i++){
      ctx.strokeStyle=bm.flash>0.1?'#d8ff9a':'rgba(150,210,95,0.55)';
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.arc(0,0,bm.r-4,i*TAU/8,i*TAU/8+0.22);
      ctx.stroke();
    }
    ctx.restore();
    // Linse
    const lens=ctx.createRadialGradient(-2,-2,1,0,0,8);
    lens.addColorStop(0,bm.flash>0.1?'#ffffff':'#b6ff70');
    lens.addColorStop(0.5,bm.flash>0.1?'#aaff60':'#5fae32');
    lens.addColorStop(1,'#1c3410');
    ctx.fillStyle=lens;
    ctx.beginPath();ctx.arc(0,0,7.5,0,TAU);ctx.fill();
    ctx.strokeStyle='rgba(20,30,12,0.9)';ctx.lineWidth=1.4;
    ctx.beginPath();ctx.arc(0,0,8.5,0,TAU);ctx.stroke();
    // SEC
    ctx.fillStyle='rgba(220,255,190,0.85)';
    ctx.font='700 5px "Courier New",monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('SEC-'+(bm.id+1<10?'0':'')+(bm.id+1),0,bm.r-4);
    // Antenne
    ctx.strokeStyle='rgba(150,190,120,0.6)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(bm.r*0.55,-bm.r*0.6);ctx.lineTo(bm.r*0.8,-bm.r*1.15);ctx.stroke();
    ctx.fillStyle=pulse>0.5?'#ff4a32':'#521a12';
    ctx.beginPath();ctx.arc(bm.r*0.8,-bm.r*1.15,1.8,0,TAU);ctx.fill();
    // Schlagblitz
    if(bm.flash>0.1){
      ctx.strokeStyle=`rgba(220,255,170,${bm.flash*0.8})`;
      ctx.lineWidth=1.4;
      for(let i=0;i<5;i++){
        const a=rand(0,TAU),r1=bm.r+2,r2=bm.r+rand(5,14);
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*r1,Math.sin(a)*r1);
        ctx.lineTo(Math.cos(a+0.15)*r2,Math.sin(a+0.15)*r2);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawZombie(z){
    const t=G.t;
    const r=z.r;
    const variant=Math.floor((z.seed||0)*7)%3;
    const bob=Math.sin(z.phase)*1.4;
    const lunge=z.brute?Math.sin(t*2+z.phase)*2.6:Math.sin(t*1.4+z.phase)*1.6;
    const eye=z.mutant?'#ff5a3a':'#d8ffa0';
    ctx.save();
    ctx.translate(z.x+lunge,z.y+bob);
    // Aura bei Mutanten
    if(z.mutant){
      const ag=ctx.createRadialGradient(0,0,2,0,0,r*2.2);
      ag.addColorStop(0,'rgba(200,30,20,0.15)');
      ag.addColorStop(1,'rgba(200,30,20,0)');
      ctx.fillStyle=ag;
      ctx.beginPath();ctx.arc(0,0,r*2.2,0,TAU);ctx.fill();
    }
    // Schatten
    ctx.fillStyle='rgba(0,0,0,0.45)';
    ctx.beginPath();ctx.ellipse(0,r*1.36,r*0.95,4.5,0,0,TAU);ctx.fill();
    // Beine
    const step=Math.sin(z.phase*2);
    ctx.lineCap='round';
    ctx.strokeStyle=z.mutant?'#331c12':'#2f3a22';ctx.lineWidth=r*0.27;
    ctx.beginPath();ctx.moveTo(-r*0.26,r*0.6);ctx.quadraticCurveTo(-r*0.42,r*1.0,-r*0.34+step*2,r*1.32);ctx.stroke();
    ctx.strokeStyle=z.mutant?'#28150e':'#26301b';
    ctx.beginPath();ctx.moveTo(r*0.26,r*0.6);ctx.quadraticCurveTo(r*0.42,r*1.02,r*0.34-step*2,r*1.34);ctx.stroke();
    // Stiefel
    ctx.fillStyle='#10140c';
    ctx.beginPath();ctx.ellipse(-r*0.36+step*2,r*1.38,r*0.19,r*0.1,0.15,0,TAU);ctx.fill();
    ctx.beginPath();ctx.ellipse(r*0.36-step*2,r*1.4,r*0.19,r*0.1,-0.1,0,TAU);ctx.fill();
    // Torso
    const suit=ctx.createLinearGradient(0,-r*0.8,0,r*0.8);
    if(z.mutant){
      suit.addColorStop(0,'#5b3323');suit.addColorStop(0.55,'#391f16');suit.addColorStop(1,'#1d0e09');
    } else {
      suit.addColorStop(0,'#5b6a3c');suit.addColorStop(0.55,'#354225');suit.addColorStop(1,'#171e10');
    }
    ctx.fillStyle=suit;
    ctx.beginPath();
    ctx.moveTo(-r*0.5,-r*0.55);
    ctx.quadraticCurveTo(-r*0.68,-r*0.05,-r*0.52,r*0.52);
    ctx.lineTo(-r*0.24,r*0.68);
    ctx.lineTo(0,r*0.58);
    ctx.lineTo(r*0.26,r*0.68);
    ctx.lineTo(r*0.52,r*0.52);
    ctx.quadraticCurveTo(r*0.68,-r*0.05,r*0.5,-r*0.55);
    ctx.quadraticCurveTo(0,-r*0.8,-r*0.5,-r*0.55);
    ctx.closePath();ctx.fill();
    // Schulterpolster
    ctx.fillStyle=z.mutant?'#3a2015':'#2b3520';
    ctx.beginPath();ctx.ellipse(-r*0.5,-r*0.5,r*0.18,r*0.13,-0.4,0,TAU);ctx.fill();
    ctx.beginPath();ctx.ellipse(r*0.5,-r*0.5,r*0.18,r*0.13,0.4,0,TAU);ctx.fill();
    ctx.strokeStyle='rgba(180,215,145,0.14)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(-r*0.4,-r*0.62);ctx.quadraticCurveTo(0,-r*0.76,r*0.4,-r*0.62);ctx.stroke();
    // Reißverschluss
    ctx.strokeStyle='rgba(170,200,140,0.20)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(0,-r*0.62);ctx.lineTo(0,r*0.6);ctx.stroke();
    // aufgerissene Stelle
    ctx.fillStyle='rgba(74,10,12,0.92)';
    ctx.beginPath();
    ctx.moveTo(-r*0.38,-r*0.18);
    ctx.lineTo(-r*0.08,r*0.0);
    ctx.lineTo(-r*0.2,r*0.36);
    ctx.lineTo(-r*0.48,r*0.06);
    ctx.closePath();ctx.fill();
    // Rippen / Fleisch
    ctx.strokeStyle='rgba(205,175,140,0.45)';ctx.lineWidth=1;
    for(let i=0;i<3;i++){
      ctx.beginPath();ctx.arc(-r*0.24,r*0.02,r*(0.06+i*0.05),-1.2,0.7);ctx.stroke();
    }
    // Blutspritzer
    ctx.fillStyle='rgba(90,6,12,0.6)';
    for(let i=0;i<3;i++){
      ctx.beginPath();
      ctx.ellipse(r*(-0.38+i*0.34),r*(0.3+((i*7)%3)*0.1),r*0.08,r*0.12,i*0.7,0,TAU);
      ctx.fill();
    }
    // Arme (ausgestreckt)
    const arm=Math.sin(z.phase)*0.5;
    ctx.strokeStyle=z.mutant?'#4a281b':'#46552d';ctx.lineWidth=r*0.25;
    ctx.beginPath();ctx.moveTo(-r*0.48,-r*0.42);
    ctx.quadraticCurveTo(-r*0.85,-r*0.3,-r*0.98,-r*0.42+arm*2);
    ctx.stroke();
    ctx.strokeStyle=z.mutant?'#57301f':'#526236';
    ctx.beginPath();ctx.moveTo(r*0.48,-r*0.42);
    ctx.quadraticCurveTo(r*0.85,-r*0.3,r*0.98,-r*0.42-arm*2);
    ctx.stroke();
    // Handschuhe
    ctx.fillStyle='#1b2412';
    ctx.beginPath();ctx.arc(-r*1.0,-r*0.42+arm*2,r*0.16,0,TAU);ctx.fill();
    ctx.beginPath();ctx.arc(r*1.0,-r*0.42-arm*2,r*0.16,0,TAU);ctx.fill();
    // Finger / Klauen
    ctx.strokeStyle='rgba(200,205,175,0.55)';ctx.lineWidth=1;
    for(let i=-1;i<=1;i++){
      ctx.beginPath();ctx.moveTo(-r*1.05+i*2.4,-r*0.42+arm*2);ctx.lineTo(-r*1.14+i*2.4,-r*0.55+arm*2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(r*1.05+i*2.4,-r*0.42-arm*2);ctx.lineTo(r*1.14+i*2.4,-r*0.55-arm*2);ctx.stroke();
    }
    // Kopf / Kapuze
    const hood=ctx.createRadialGradient(-r*0.15,-r*1.02,1,0,-r*0.95,r*0.5);
    hood.addColorStop(0,z.mutant?'#5c3824':'#5d6d40');
    hood.addColorStop(1,z.mutant?'#321b12':'#334022');
    ctx.fillStyle=hood;
    ctx.beginPath();ctx.arc(0,-r*0.95,r*0.46,0,TAU);ctx.fill();
    // Kapuzenrand
    ctx.strokeStyle='rgba(18,24,12,0.8)';ctx.lineWidth=1.3;
    ctx.beginPath();ctx.arc(0,-r*0.95,r*0.42,-2.7,0.5);ctx.stroke();
    // Gasmaske
    if(variant<2){
      // linke Linse
      ctx.fillStyle='#0a1007';
      ctx.beginPath();ctx.arc(-r*0.17,-r*1.0,r*0.135,0,TAU);ctx.fill();
      ctx.strokeStyle='rgba(150,190,120,0.30)';ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(-r*0.17,-r*1.0,r*0.135,0,TAU);ctx.stroke();
      // rechtes Glas (Sprungsriss oder erloschen)
      ctx.fillStyle='#0a1007';
      ctx.beginPath();ctx.arc(r*0.17,-r*1.0,r*0.135,0,TAU);ctx.fill();
      ctx.strokeStyle='rgba(150,190,120,0.22)';ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(r*0.17,-r*1.0,r*0.135,0,TAU);ctx.stroke();
      // glühendes Auge
      ctx.fillStyle=eye;ctx.shadowColor=eye;ctx.shadowBlur=7;
      ctx.beginPath();ctx.arc(-r*0.17,-r*1.0,r*0.055,0,TAU);ctx.fill();
      ctx.shadowBlur=0;
      if(variant===0){
        ctx.fillStyle='rgba(216,255,160,0.5)';
        ctx.beginPath();ctx.arc(r*0.17,-r*1.0,r*0.04,0,TAU);ctx.fill();
      } else {
        // Sprung im rechten Glas
        ctx.strokeStyle='rgba(200,230,170,0.35)';ctx.lineWidth=0.8;
        ctx.beginPath();
        ctx.moveTo(r*0.08,-r*1.12);ctx.lineTo(r*0.17,-r*1.0);ctx.lineTo(r*0.1,-r*0.88);
        ctx.stroke();
      }
      // Filter
      ctx.fillStyle='#141b0e';
      roundRect(ctx,-r*0.12,-r*0.82,r*0.24,r*0.17,r*0.06);ctx.fill();
      ctx.strokeStyle='rgba(150,180,120,0.25)';ctx.lineWidth=1;
      roundRect(ctx,-r*0.12,-r*0.82,r*0.24,r*0.17,r*0.06);ctx.stroke();
      // Blut aus dem Filter
      ctx.fillStyle='rgba(105,8,14,0.7)';
      ctx.beginPath();ctx.ellipse(r*0.02,-r*0.66,r*0.035,r*0.09,0.15,0,TAU);ctx.fill();
    } else {
      // Maske abgerissen: freiliegender Schädel
      ctx.fillStyle='rgba(22,28,14,0.85)';
      ctx.beginPath();ctx.ellipse(0,-r*1.0,r*0.33,r*0.3,0,0,TAU);ctx.fill();
      ctx.fillStyle='rgba(190,180,150,0.55)';
      ctx.beginPath();ctx.ellipse(0,-r*0.92,r*0.24,r*0.2,0,0,TAU);ctx.fill();
      // Augen
      ctx.fillStyle=eye;ctx.shadowColor=eye;ctx.shadowBlur=7;
      ctx.beginPath();ctx.arc(-r*0.11,-r*1.02,r*0.07,0,TAU);ctx.fill();
      ctx.beginPath();ctx.arc(r*0.11,-r*1.02,r*0.07,0,TAU);ctx.fill();
      ctx.shadowBlur=0;
      // blutiges Maul
      ctx.fillStyle='rgba(34,4,6,0.95)';
      ctx.beginPath();ctx.ellipse(0,-r*0.82,r*0.16,r*0.12,0,0,TAU);ctx.fill();
      ctx.fillStyle='rgba(215,205,175,0.9)';
      for(let i=0;i<4;i++){
        ctx.beginPath();
        ctx.moveTo(-r*0.12+i*r*0.07,-r*0.9);
        ctx.lineTo(-r*0.09+i*r*0.07,-r*0.8);
        ctx.lineTo(-r*0.06+i*r*0.07,-r*0.9);
        ctx.closePath();ctx.fill();
      }
      // Blut
      ctx.strokeStyle='rgba(130,10,18,0.8)';ctx.lineWidth=1.1;
      ctx.beginPath();ctx.moveTo(0,-r*0.73);ctx.quadraticCurveTo(r*0.05,-r*0.3,r*0.02,r*0.1);ctx.stroke();
    }
    // Blut am Anzug / Hals
    ctx.fillStyle='rgba(105,8,14,0.65)';
    ctx.beginPath();ctx.ellipse(-r*0.2,-r*0.5,r*0.06,r*0.18,0.2,0,TAU);ctx.fill();
    // Verletzungsblitz
    if(z.hurt>0){
      ctx.globalAlpha=z.hurt*0.5;
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(0,0,r*0.95,0,TAU);ctx.fill();
      ctx.globalAlpha=1;
    }
    // Brute-Markierung
    if(z.brute){
      ctx.fillStyle='rgba(255,80,50,0.85)';
      ctx.font='700 5px "Courier New",monospace';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('BRUTE',0,-r*1.55);
    }
    ctx.restore();
  }

  function drawKicker(k){
    const t=G.t;
    ctx.save();
    ctx.translate(k.x,k.y);
    ctx.rotate(k.side>0?-0.18:0.18);
    // Glow
    const gl=ctx.createRadialGradient(0,0,2,0,0,34);
    gl.addColorStop(0,`rgba(255,80,50,${0.10+k.flash*0.32})`);
    gl.addColorStop(1,'rgba(255,80,50,0)');
    ctx.fillStyle=gl;
    ctx.beginPath();ctx.arc(0,0,34,0,TAU);ctx.fill();
    // Rampe
    ctx.beginPath();ctx.moveTo(-15,12);ctx.lineTo(15,12);ctx.lineTo(0,-13);ctx.closePath();
    const wg=ctx.createLinearGradient(0,-13,0,12);
    wg.addColorStop(0,k.flash>0.1?'#ffd9a0':'#5a6b42');
    wg.addColorStop(1,'#171f12');
    ctx.fillStyle=wg;ctx.fill();
    ctx.strokeStyle=k.flash>0.1?'#ffe9b0':'rgba(170,220,120,0.6)';ctx.lineWidth=1.4;ctx.stroke();
    // Gefahrenstreifen
    ctx.save();
    ctx.beginPath();ctx.moveTo(-14,12);ctx.lineTo(14,12);ctx.lineTo(10,5);ctx.lineTo(-10,5);ctx.closePath();ctx.clip();
    for(let i=-20;i<20;i+=6){
      ctx.fillStyle=i%12===0?'#c9a227':'#1a1f12';
      ctx.fillRect(i,5,3,8);
    }
    ctx.restore();
    // Leuchtauge
    const pulse=0.5+0.5*Math.sin(t*3.4+k.side);
    ctx.fillStyle=k.flash>0.1?'#fff':`rgba(255,74,50,${0.5+0.5*pulse})`;
    ctx.beginPath();ctx.arc(0,-2,2.4,0,TAU);ctx.fill();
    // Beschriftung
    ctx.fillStyle='rgba(210,235,190,0.55)';
    ctx.font='700 5px "Courier New",monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('KICK',0,9);
    // Funken
    if(k.flash>0.1){
      ctx.strokeStyle=`rgba(255,230,170,${k.flash*0.8})`;
      ctx.lineWidth=1.2;
      for(let i=0;i<4;i++){
        const a=rand(0,TAU);
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*15,Math.sin(a)*15);
        ctx.lineTo(Math.cos(a+0.12)*(15+rand(4,12)),Math.sin(a+0.12)*(15+rand(4,12)));
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawPowerup(pu){
    const t=G.t;
    const bob=Math.sin(t*2.5+pu.phase)*3;
    ctx.save();
    ctx.translate(pu.x,pu.y+bob);
    const gl=ctx.createRadialGradient(0,0,2,0,0,22);
    gl.addColorStop(0,pu.color);
    gl.addColorStop(1,'rgba(0,0,0,0)');
    ctx.globalAlpha=0.22;
    ctx.fillStyle=gl;
    ctx.beginPath();ctx.arc(0,0,22,0,TAU);ctx.fill();
    ctx.globalAlpha=1;
    // Ring
    ctx.save();
    ctx.rotate(t*1.2+pu.phase);
    ctx.strokeStyle=pu.color;
    ctx.globalAlpha=0.65;
    ctx.lineWidth=1.2;
    for(let i=0;i<4;i++){
      ctx.beginPath();ctx.arc(0,0,14,i*TAU/4,i*TAU/4+0.6);ctx.stroke();
    }
    ctx.restore();
    // Kanister
    ctx.fillStyle='#0c130b';
    roundRect(ctx,-6,-14,12,28,4);ctx.fill();
    ctx.strokeStyle=pu.color;ctx.lineWidth=1.6;
    roundRect(ctx,-6,-14,12,28,4);ctx.stroke();
    // Deckel
    ctx.fillStyle=pu.color;
    ctx.fillRect(-4,-16,8,3);
    // Leuchten
    for(let i=0;i<2;i++){
      ctx.fillStyle=Math.sin(t*4+i*2+pu.phase)>0?pu.color:'rgba(80,100,70,0.4)';
      ctx.beginPath();ctx.arc(0,-6+i*12,2,0,TAU);ctx.fill();
    }
    // Buchstabe
    ctx.fillStyle='#fff';
    ctx.font='900 7px "Courier New",monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(pu.type,0,1);
    ctx.restore();
  }

  function drawFlipper(f){
    ctx.save();
    ctx.translate(f.px,f.py);
    ctx.rotate(f.angle);
    // Glow
    if(f.active){
      ctx.shadowColor='rgba(157,255,58,0.8)';
      ctx.shadowBlur=14;
    }
    // Hebel
    ctx.strokeStyle='#0d120b';ctx.lineWidth=13;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(f.len,0);ctx.stroke();
    ctx.strokeStyle=f.active?'#6f9a3e':'#33422a';ctx.lineWidth=8;
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(f.len,0);ctx.stroke();
    ctx.shadowBlur=0;
    // Grünkante
    ctx.strokeStyle=f.active?'rgba(200,255,140,0.95)':'rgba(140,190,100,0.4)';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(4,-3);ctx.lineTo(f.len-3,-3);ctx.stroke();
    // Warnstreifen
    for(let i=0;i<4;i++){
      ctx.fillStyle=i%2?'rgba(200,220,60,0.5)':'rgba(15,20,10,0.8)';
      ctx.fillRect(16+i*4,-4,2.2,8);
    }
    // Achse
    ctx.fillStyle='#1b2416';
    ctx.beginPath();ctx.arc(0,0,9,0,TAU);ctx.fill();
    ctx.strokeStyle='rgba(150,200,110,0.5)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(0,0,9,0,TAU);ctx.stroke();
    ctx.fillStyle=f.active?'#9dff3a':'#4a5c3a';
    ctx.beginPath();ctx.arc(0,0,3,0,TAU);ctx.fill();
    // Spitze
    ctx.fillStyle='#1b2416';
    ctx.beginPath();ctx.arc(f.len,0,5.5,0,TAU);ctx.fill();
    ctx.restore();
  }

  function drawDamageFx(){
    const t=G.t;
    if(G.damageFlash>0){
      const a=G.damageFlash*0.30;
      const rg=ctx.createRadialGradient(W/2,H/2,100,W/2,H/2,430);
      rg.addColorStop(0,'rgba(120,0,0,0)');
      rg.addColorStop(1,'rgba(160,0,0,'+a+')');
      ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
    }
    if(G.lives<=1 && G.state==='play'){
      const a=0.05+0.035*Math.sin(t*4.2);
      const rg=ctx.createRadialGradient(W/2,H/2,140,W/2,H/2,430);
      rg.addColorStop(0,'rgba(120,0,0,0)');
      rg.addColorStop(1,'rgba(150,0,0,'+a+')');
      ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
    }
  }

  function drawParticles(){
    for(const p of parts){
      const a=clamp(p.life/p.max,0,1);
      if(p.kind==='spark'){
        ctx.globalAlpha=a;
        ctx.fillStyle=p.color;
        ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
      } else if(p.kind==='steam'){
        ctx.globalAlpha=a*0.6;
        ctx.fillStyle=p.color;
        ctx.beginPath();ctx.arc(p.x,p.y,p.size*(1.6-a*0.6),0,TAU);ctx.fill();
      } else {
        ctx.globalAlpha=a*0.9;
        ctx.fillStyle=p.color;
        ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,TAU);ctx.fill();
      }
    }
    ctx.globalAlpha=1;
  }

  function drawPops(){
    for(const p of pops){
      const a=clamp(p.life/p.max,0,1);
      ctx.save();
      ctx.globalAlpha=a;
      ctx.fillStyle=p.color;
      ctx.font='900 9px "Courier New",monospace';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(p.text,p.x,p.y);
      ctx.restore();
    }
  }

  function drawBall(b){
    const t=G.t;
    // Schweif
    for(let i=0;i<b.trail.length;i++){
      const p=b.trail[i];
      const a=(i/b.trail.length)*0.20;
      ctx.fillStyle=`rgba(157,255,58,${a})`;
      ctx.beginPath();ctx.arc(p.x,p.y,Math.max(1,b.r*(i/b.trail.length)),0,TAU);ctx.fill();
    }
    // Glow
    const gl=ctx.createRadialGradient(b.x,b.y,2,b.x,b.y,b.r*3.2);
    gl.addColorStop(0,'rgba(180,255,110,0.35)');
    gl.addColorStop(1,'rgba(120,220,70,0)');
    ctx.fillStyle=gl;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r*3.2,0,TAU);ctx.fill();
    if(b.serving){
      // WUMMI auf der Abschussrampe
      drawWummi(b.x,b.y,0.46*(b.r/8.5),t,{running:false,look:0,facing:1});
      // Ladeanzeige
      ctx.save();
      ctx.strokeStyle='rgba(157,255,58,0.25)';
      ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(b.x,b.y,b.r+14,-Math.PI/2,-Math.PI/2+TAU*G.charge);ctx.stroke();
      ctx.fillStyle='rgba(200,255,160,0.85)';
      ctx.font='700 7px "Courier New",monospace';
      ctx.textAlign='center';ctx.textBaseline='middle';
      spaced(ctx,'HALTEN & LOSLASSEN',b.x,b.y-30,1,'center');
      ctx.strokeStyle='rgba(150,210,110,0.35)';ctx.lineWidth=2;
      ctx.beginPath();ctx.ellipse(b.x,b.y+b.r+9,16,5,0,0,TAU);ctx.stroke();
      ctx.restore();
    } else {
      // Stahlkugel mit WUMMI-Silhouette
      const rg=ctx.createRadialGradient(b.x-b.r*0.35,b.y-b.r*0.4,b.r*0.1,b.x,b.y,b.r);
      rg.addColorStop(0,'#fbfff0');
      rg.addColorStop(0.3,'#d3efa8');
      rg.addColorStop(0.66,'#7ab63f');
      rg.addColorStop(1,'#1d3a12');
      ctx.fillStyle=rg;
      ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.fill();
      // WUMMI-Silhouette
      ctx.save();
      ctx.translate(b.x,b.y);
      ctx.scale(b.facing<0?-1:1,1);
      ctx.fillStyle='rgba(24,48,14,0.62)';
      roundRect(ctx,-b.r*0.62,-b.r*0.14,b.r*0.82,b.r*0.30,b.r*0.14);ctx.fill();
      ctx.beginPath();ctx.arc(b.r*0.28,-b.r*0.08,b.r*0.20,0,TAU);ctx.fill();
      ctx.beginPath();ctx.ellipse(b.r*0.18,-b.r*0.36,b.r*0.075,b.r*0.15,0.5,0,TAU);ctx.fill();
      ctx.fillRect(-b.r*0.5,b.r*0.1,b.r*0.1,b.r*0.22);
      ctx.fillRect(b.r*0.1,b.r*0.1,b.r*0.1,b.r*0.22);
      ctx.beginPath();
      ctx.moveTo(-b.r*0.6,-b.r*0.08);
      ctx.lineTo(-b.r*0.84,-b.r*0.34);
      ctx.lineTo(-b.r*0.54,0);
      ctx.closePath();ctx.fill();
      ctx.restore();
      // Glanzpunkte
      ctx.fillStyle='rgba(255,255,255,0.85)';
      ctx.beginPath();ctx.arc(b.x-b.r*0.3,b.y-b.r*0.36,b.r*0.2,0,TAU);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.35)';
      ctx.beginPath();ctx.arc(b.x+b.r*0.26,b.y-b.r*0.14,b.r*0.09,0,TAU);ctx.fill();
      // exakter Trefferring
      ctx.strokeStyle=b.bomb?'rgba(255,90,60,0.9)':'rgba(190,255,130,0.65)';
      ctx.lineWidth=1.2;
      ctx.beginPath();ctx.arc(b.x,b.y,b.r+3,0,TAU);ctx.stroke();
    }
    if(b.bomb){
      ctx.strokeStyle='rgba(255,80,50,0.45)';
      ctx.beginPath();ctx.arc(b.x,b.y,b.r+8+Math.sin(t*10)*2,0,TAU);ctx.stroke();
    }
  }
  // ---------- Zeichnen / Ablauf ----------
  function drawGameWorld(){
    if(playBgCache) ctx.drawImage(playBgCache,0,0,W,H);
    drawPlayfieldFx();
    drawWalls();
    drawDecals();
    ctx.save();
    if(G.shake>0){
      ctx.translate(rand(-G.shake,G.shake)*0.55, rand(-G.shake,G.shake)*0.55);
    }
    for(const pu of powerups) drawPowerup(pu);
    for(const k of KICKERS) drawKicker(k);
    for(const bm of bumpers) drawBumper(bm);
    for(const z of zombies) drawZombie(z);
    drawFlipper(flips.L);
    drawFlipper(flips.R);
    for(const b of balls){ if(!b.dead) drawBall(b); }
    drawParticles();
    drawPops();
    ctx.restore();
  }

  function drawGame(){
    drawGameWorld();
    drawDamageFx();
    drawHUD();
    drawBanner();
    if(G.slow && G.slow<1){
      ctx.save();
      ctx.fillStyle='rgba(60,200,255,0.035)';
      ctx.fillRect(0,50,W,H-50);
      ctx.restore();
    }
  }

  function draw(){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.clearRect(0,0,W,H);
    switch(G.state){
      case 'menu': drawMenu(); break;
      case 'play': drawGame(); break;
      case 'gameover':
        drawGameWorld();
        drawHUD();
        drawGameOver();
        break;
      case 'difficulty': drawDifficulty(); break;
      case 'ranking': drawRanking(); break;
      default: drawMenu();
    }
  }

  function update(step){
    G.t += step/1000;
    if(G.state==='play') updateGame(step);
    if(G.shake>0 && G.state!=='play') G.shake=Math.max(0,G.shake-step*0.02);
  }

  // ---------- Eingabe-Routing ----------
  const roles=new Map();
  function clearInput(){
    roles.clear();
    flips.L.hold=false; flips.R.hold=false;
    G.charging=false;
  }
  function handleDown(x,y,id){
    // Ton
    if((G.state==='menu'||G.state==='play'||G.state==='gameover') && inRect(BTN.mute,x,y)){
      toggleMute(); SFX.click(); return;
    }
    if(G.state==='menu'){
      if(inRect(BTN.start,x,y)){ SFX.click(); startGame(); return; }
      if(inRect(BTN.rank,x,y)){ SFX.click(); G.state='ranking'; return; }
      if(inRect(BTN.diff,x,y)){ SFX.click(); G.state='difficulty'; return; }
      if(x>52&&x<323&&y>450&&y<600){
        G.barkUntil=performance.now()+900;
        SFX.bark();
        return;
      }
      return;
    }
    if(G.state==='difficulty'){
      for(const c of DIFF_CARDS){
        if(inRect(c,x,y)){
          G.diff=c.key;
          store.set(DIFF_KEY,G.diff);
          SFX.click();
          return;
        }
      }
      if(inRect(BTN.back,x,y)){ SFX.click(); G.state='menu'; return; }
      return;
    }
    if(G.state==='ranking'){
      if(inRect(BTN.back,x,y)){ SFX.click(); G.state='menu'; return; }
      return;
    }
    if(G.state==='gameover'){
      if(inRect(BTN.again,x,y)){ SFX.click(); clearInput(); startGame(); return; }
      if(inRect(BTN.toMenu,x,y)){ SFX.click(); clearInput(); G.state='menu'; return; }
      return;
    }
    if(G.state==='play'){
      if(G.serving && y>H*0.5){
        G.charging=true;
        G.charge=0;
        G.chargeStart=performance.now();
        roles.set(id,'charge');
        return;
      }
      if(!G.serving){
        const side=x<W/2?'L':'R';
        roles.set(id,side);
        flips[side].hold=true;
        flips[side].minUntil=performance.now()+95;
        SFX.flipper();
      }
    }
  }

  function handleUp(x,y,id){
    const role=roles.get(id);
    if(!role) return;
    roles.delete(id);
    if(role==='charge'){
      if(G.serving){
        launchBall(0.35+0.65*clamp(G.charge,0,1));
      }
      G.charging=false;
      return;
    }
    if(role==='L'||role==='R'){
      let still=false;
      for(const r of roles.values()) if(r===role) still=true;
      if(!still) flips[role].hold=false;
    }
  }

  // ---------- Init ----------
  function initAssets(){
    titleCache=makeCache(W,118,buildTitle);
    menuBgCache=makeCache(W,H,buildMenuBg);
    playBgCache=makeCache(W,H,buildPlayBg);
    initDust();
    G.best=loadScores().length?loadScores()[0].score:0;
  }

  let last=performance.now(), acc=0;
  function frame(now){
    let delta=Math.min(now-last,100);
    last=now;
    acc+=delta;
    let steps=0;
    while(acc>=16.6667 && steps<3){
      update(16.6667);
      acc-=16.6667;
      steps++;
    }
    if(steps===3) acc=0;
    draw();
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange',()=>{
    last=performance.now(); acc=0;
  });

  // ---------- Debug / Test-Hooks ----------
  window.WUMMI={
    start:()=>startGame(),
    menu:()=>{ G.state='menu'; },
    ranking:()=>{ G.state='ranking'; },
    difficulty:()=>{ G.state='difficulty'; },
    launch:(p)=>{ launchBall(p==null?1:p); },
    gameover:()=>endGame(),
    state:()=>({
      state:G.state, score:G.score, wave:G.wave, lives:G.lives, diff:G.diff,
      serving:G.serving, charging:G.charging, charge:+G.charge.toFixed(2),
      flipL:flips.L.hold, flipR:flips.R.hold, flipperActiveL:flips.L.active, flipperActiveR:flips.R.active,
      balls:balls.map(b=>({x:+b.x.toFixed(1),y:+b.y.toFixed(1),vx:+b.vx.toFixed(2),vy:+b.vy.toFixed(2),serving:b.serving,stuck:+(b.stuck||0).toFixed(0)})),
      zombies:zombies.length, bumpers:bumpers.length, powerups:powerups.length,
      bumperList:bumpers.map(b=>({x:Math.round(b.x),y:Math.round(b.y)})), zombieList:zombies.map(z=>({x:Math.round(z.x),y:Math.round(z.y),r:z.r}))
    })
  };

  initAssets();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
